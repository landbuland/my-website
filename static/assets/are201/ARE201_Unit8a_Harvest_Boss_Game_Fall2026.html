<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvest Boss — ARE 201 Unit 8a</title>
<style>
:root {
  --accent: #EB811B; --accent-soft: #fff4e8; --ink: #1f2933; --muted: #5f6b76; --line: #d8dde3; --soft: #f3f4f6;
  --blue: #2f80c9; --blue-soft: #eef5fb; --green: #378a61; --green-soft: #e9f6ef; --red: #c9504d; --red-soft: #fcedec;
  --purple: #7657a5; --purple-soft: #f3effa; --gold: #f2b632; --paper: #fffaf2;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
body { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
b, strong { font-weight: 800; }

#stage { position: absolute; left: 50%; top: 50%; width: 960px; height: 720px; transform: translate(-50%, -50%);
  background: var(--paper); overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.35); }

/* ---------- scene ---------- */
#sceneWrap { position: absolute; left: 0; top: 0; width: 960px; height: 430px; overflow: hidden; }
#scene { display: block; width: 960px; height: 430px; }
#sceneWrap.shake { animation: shake .6s linear; }
@keyframes shake { 0%,100% { transform: translate(0,0); } 15% { transform: translate(-7px,2px); } 30% { transform: translate(6px,-2px); }
  45% { transform: translate(-5px,1px); } 60% { transform: translate(4px,0); } 80% { transform: translate(-2px,1px); } }
.cloud { animation: drift linear infinite; }
@keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1140px); } }
#sun { animation: sunPulse 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sunPulse { 50% { transform: scale(1.06); } }
.crate { transform-box: fill-box; transform-origin: 50% 100%; }
.crate.pop { animation: pop .5s cubic-bezier(.3,1.7,.5,1) both; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.crate.tip { animation: tip 1s ease-in forwards; }
@keyframes tip { 0% { transform: rotate(0); } 35% { transform: translate(8px,0) rotate(40deg); } 100% { transform: translate(30px,64px) rotate(120deg); opacity: 0; } }
.pot.gone { transition: opacity .25s, transform .25s; opacity: 0; }
.bubble rect { fill: #fff; stroke: #1f2933; stroke-width: 1.4; }
.bubble path { fill: #fff; stroke: #1f2933; stroke-width: 1.4; }
.bubble text { font: 700 12px Arial, sans-serif; fill: #1f2933; }
.bubble.warn rect, .bubble.warn path { fill: #fff1ef; stroke: #c9504d; }
.bubble.warn text { fill: #a83c39; }
.float { font: 900 20px "Avenir Next", Arial, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 4px; }

/* HUD + notebook over the scene */
#hud { position: absolute; right: 12px; top: 12px; width: 252px; z-index: 3; display: none; }
#hud.on { display: block; }
.hud-row { display: grid; grid-template-columns: .9fr 1.25fr; gap: 8px; }
.hud-card { margin-bottom: 8px; padding: 7px 12px 8px; border-radius: 10px; background: rgba(255,255,255,.93); box-shadow: 0 3px 10px rgba(31,41,51,.14); }
.hud-lab { display: block; color: var(--muted); font-size: 10.5px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
.hud-val { display: block; font-size: 27px; font-weight: 850; line-height: 1.08; font-variant-numeric: tabular-nums; }
#hudSub { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 700; }
#hudDots { display: flex; gap: 3px; margin-top: 4px; }
#hudDots i { width: 9px; height: 9px; border-radius: 50%; background: #e3e7eb; }
#hudDots i.on { background: var(--accent); }
.neg { color: var(--red); } .pos { color: var(--green); }

#notebook { position: absolute; left: 12px; top: 12px; width: 222px; z-index: 3; display: none; padding: 9px 12px 9px; border-radius: 10px;
  background: #fffdf3; box-shadow: 0 3px 10px rgba(31,41,51,.15); }
#notebook.on { display: block; }
#notebook h4 { margin: 0 0 3px; color: var(--accent); font-size: 10.5px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
.nb-row { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: center; height: 22px; border-bottom: 1px solid #eef1f5; font-size: 14px; font-weight: 750; }
.nb-row .num { color: var(--muted); font-size: 11px; }
.nb-row.gone .nm { color: #9aa3ab; text-decoration: line-through; }
.chip { display: inline-block; min-width: 46px; padding: 1px 7px; border-radius: 10px; background: var(--green); color: #fff; font-size: 12px; font-weight: 850; text-align: center; }
.chip.down { background: var(--accent); } .chip.neg { background: var(--red); } .chip.gone { background: #b8c0c8; }
.nb-flag { margin-top: 5px; padding: 3px 7px; border-radius: 5px; background: var(--accent-soft); color: #b8600f; font-size: 11px; font-weight: 850; }
.nb-foot { margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }

#banner { position: absolute; left: 50%; top: 78px; z-index: 4; padding: 10px 22px; border-radius: 999px; background: var(--accent); color: #fff;
  font-size: 19px; font-weight: 850; white-space: nowrap; opacity: 0; transform: translate(-50%, -26px); transition: all .35s ease;
  box-shadow: 0 6px 18px rgba(31,41,51,.25); pointer-events: none; }
#banner.show { opacity: 1; transform: translate(-50%, 0); }
#banner.red { background: var(--red); } #banner.green { background: var(--green); }

/* ---------- dialogue panel ---------- */
#panel { position: absolute; left: 0; top: 430px; width: 960px; height: 290px; padding: 18px 22px 14px; display: grid;
  grid-template-columns: 104px 1fr; gap: 18px; border-top: 5px solid var(--accent); background: var(--paper); }
#portrait { width: 104px; height: 104px; overflow: hidden; border: 3px solid var(--accent); border-radius: 50%; background: #fff; }
#portrait svg { display: block; width: 100%; height: 100%; }
#speech { min-width: 0; }
#who { padding-right: 210px; color: var(--accent); font-size: 13px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; }
.pill { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 10.5px; letter-spacing: .07em; vertical-align: 1px; }
.pill.predict { background: var(--purple); }
#text { margin-top: 8px; font-size: 18.5px; line-height: 1.38; }
#text i { color: #44505c; }
#text .concept, #text .aside, #text .note { display: block; margin-top: 7px; padding: 6px 11px; font-size: 15.5px; line-height: 1.33; }
#text .concept { border-left: 4px solid var(--blue); background: var(--blue-soft); }
#text .aside { border-left: 4px solid var(--purple); background: var(--purple-soft); }
#text .note { border-left: 4px solid var(--gold); background: #fffbea; }
.fb { display: inline-block; margin-bottom: 5px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 850; }
.fb.ok { background: var(--green-soft); color: var(--green); } .fb.no { background: var(--red-soft); color: var(--red); }
#choices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.choice { display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 7px 16px 7px 9px; border: 0; border-radius: 12px;
  background: var(--accent); color: #fff; font-size: 17px; font-weight: 800; line-height: 1.15; text-align: left; cursor: pointer;
  box-shadow: 0 3px 0 #c56a12; transition: transform .08s, filter .15s; }
.choice:hover { filter: brightness(1.05); transform: translateY(-1px); }
.choice:active { transform: translateY(2px); box-shadow: 0 1px 0 #c56a12; }
.choice .key { display: inline-flex; flex: none; width: 24px; height: 24px; align-items: center; justify-content: center; border-radius: 50%;
  background: rgba(255,255,255,.3); font-size: 12.5px; }
.choice .sub { display: block; margin-top: 1px; font-size: 12px; font-weight: 700; opacity: .88; }
.choice.alt { background: #fff; color: var(--ink); box-shadow: 0 3px 0 #c9d0d6, inset 0 0 0 2px #d8dde3; }
.choice.alt .key { background: #e9edf1; }
.choice.blue { background: var(--blue); box-shadow: 0 3px 0 #22649f; }
.choice.purple { background: var(--purple); box-shadow: 0 3px 0 #5b4383; }
.choice.green { background: var(--green); box-shadow: 0 3px 0 #276b4a; }
.choice:disabled { opacity: .4; cursor: default; transform: none; filter: none; }
#tools { position: absolute; right: 14px; top: 12px; z-index: 2; display: flex; gap: 6px; }
.tool { width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: #fff; color: var(--muted); font-size: 15px; font-weight: 850;
  cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--line); }
.tool:hover { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }

/* ---------- overlays ---------- */
#overlay, #modal { position: absolute; inset: 0; display: none; }
#overlay { z-index: 10; } #modal { z-index: 20; }
#overlay.show, #modal.show { display: block; }
.dim { position: absolute; inset: 0; background: rgba(17,24,32,.58); }
.card { position: absolute; left: 50%; top: 50%; width: 660px; padding: 24px 30px 22px; transform: translate(-50%, -50%); border-radius: 18px;
  background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center; }
.card.wide { width: 880px; }
.card h1 { margin: 2px 0 6px; font-size: 40px; line-height: 1.05; letter-spacing: -.5px; }
.card h2 { margin: 2px 0 8px; font-size: 28px; line-height: 1.12; }
.card p { margin: 8px 0; font-size: 17px; line-height: 1.4; }
.kicker { color: var(--accent); font-size: 12.5px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
.obtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
.stars { margin: 2px 0 4px; color: var(--gold); font-size: 30px; letter-spacing: 4px; }
.stars .off { color: #e1e5e9; }
.stats { display: inline-flex; gap: 16px; margin: 6px 0 4px; padding: 8px 16px; border-radius: 999px; background: var(--soft); font-size: 15px; font-weight: 750; }
.lesson { margin-top: 10px; padding: 9px 14px; border-left: 5px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--accent-soft);
  font-size: 16px; font-weight: 750; text-align: left; }

/* title */
.title-card { position: absolute; left: 50%; top: 92px; width: 600px; padding: 20px 28px 22px; transform: translateX(-50%); border-radius: 20px;
  background: rgba(255,255,255,.9); box-shadow: 0 14px 40px rgba(31,41,51,.25); text-align: center; }
.t-main { margin: 4px 0 4px; color: var(--ink); font-size: 66px; font-weight: 900; line-height: 1; letter-spacing: 1px; }
.t-main span { color: var(--accent); }
.t-sub { margin: 6px 0 0; color: var(--muted); font-size: 20px; line-height: 1.35; }
.title-strip { position: absolute; left: 0; top: 430px; width: 960px; height: 290px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; border-top: 5px solid var(--accent); background: var(--paper); }
.title-strip .row { display: flex; gap: 12px; }
.choice.big { min-height: 62px; padding: 10px 26px 10px 14px; font-size: 22px; }
.title-note { color: var(--muted); font-size: 14px; font-weight: 650; }

/* report */
.page { position: absolute; inset: 0; padding: 22px 30px 18px; background: var(--paper); }
.rep-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.rep-head h2 { margin: 2px 0 0; font-size: 26px; line-height: 1.12; }
.rep-chip { flex: none; padding: 7px 13px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 13.5px; font-weight: 750; }
.rep-grid { display: grid; grid-template-columns: 1.22fr .98fr; gap: 18px; margin-top: 14px; align-items: start; }
.rtable { width: 100%; border-collapse: collapse; background: #fff; font-size: 14.5px; text-align: center; }
.rtable th { padding: 7px 6px; background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 800; line-height: 1.2; }
.rtable td { padding: 5px 6px; border-bottom: 1px solid var(--line); font-weight: 750; }
.rtable td.nm { text-align: left; }
.rtable tr.dim td { color: #c2c8ce; }
.rtable tr.first td { background: var(--accent-soft); }
.rtable tr.negrow td { background: var(--red-soft); }
.rtable .tagline { display: block; color: #b8600f; font-size: 10.5px; font-weight: 850; }
.rtable tr.negrow .tagline { color: var(--red); }
.yes { color: var(--green); } .no { color: var(--red); }
.rep-tools { display: flex; gap: 8px; margin-top: 8px; }
.mini { padding: 6px 11px; border: 0; border-radius: 8px; background: #fff; color: var(--ink); font-size: 12.5px; font-weight: 800; cursor: pointer;
  box-shadow: inset 0 0 0 1.5px var(--line); }
.mini:hover { box-shadow: inset 0 0 0 1.5px var(--accent); color: #b8600f; }
.chart-box { padding: 8px 10px 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.chart-box svg { display: block; width: 100%; height: auto; }
.rep-lessons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.lcard { padding: 10px 13px; border-top: 4px solid var(--blue); border-radius: 0 0 8px 8px; background: #fff; box-shadow: 0 1px 0 var(--line); }
.lcard h4 { margin: 0 0 4px; font-size: 15px; }
.lcard p { margin: 0; font-size: 13.5px; line-height: 1.33; }
.lcard.l2 { border-top-color: var(--accent); } .lcard.l3 { border-top-color: var(--green); }
.rep-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
.rep-foot .facts { font-size: 13.5px; font-weight: 700; line-height: 1.35; }
.rep-foot .obtns { margin-top: 0; flex-wrap: nowrap; }
.rep-foot .choice { min-height: 44px; font-size: 15px; }

/* long run */
.lr-chips { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
.lr-chip { padding: 6px 10px; border-radius: 8px; background: var(--soft); font-size: 13px; font-weight: 750; }
.lr-chip b { display: block; font-size: 15px; }
.foot-note { color: var(--muted); font-size: 12.5px !important; }

/* gallery + help */
.gal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 12px; }
.gtile { min-height: 118px; padding: 10px 9px; border-radius: 10px; background: var(--soft); text-align: center; }
.gtile .n { color: var(--muted); font-size: 11px; font-weight: 850; }
.gtile h3 { margin: 4px 0 2px; font-size: 15px; line-height: 1.15; }
.gtile .st { color: var(--gold); font-size: 15px; letter-spacing: 2px; }
.gtile .st .off { color: #d5dade; }
.gtile .h { color: var(--muted); font-size: 12px; line-height: 1.25; }
.gtile.found { background: var(--green-soft); box-shadow: inset 0 0 0 2px #b9dfc9; }
.gtile.locked h3 { color: #9aa3ab; }
.help-list { margin: 10px 0 0; padding: 0; list-style: none; text-align: left; }
.help-list li { margin: 7px 0; font-size: 15.5px; line-height: 1.38; }
.help-list li b { color: #b8600f; }
.toggle { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 15px; font-weight: 750; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

/* confetti */
.confetti { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(780px) rotate(720deg); } }

/* chart text */
.ct { fill: #5f6b76; font: 800 11px Arial, sans-serif; }
.cl { fill: #5f6b76; font: 600 10.5px Arial, sans-serif; }
.cv { fill: #1f2933; font: 800 10.5px Arial, sans-serif; }
.ca { fill: none; stroke: #1f2933; stroke-width: 1.6; }
</style>
</head>

  <div id="sceneWrap">

        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">

    </svg>
    <div id="notebook"></div>
    <div id="hud">

function endingFor(s) {

  if (L === 5) return s.path === 'all' ? 'comeback' : 'boss';

}

    case 'solo': return soloTarget(sp);
    case 'picker': return { x: TR.x - TR.dir * 88, y: TR.y + 12, s: 1, face: TR.dir, pick: true, v: 150 };
    case 'picker2':
      sp.modeT += dt;
      if (sp.modeT > 2.8) { sp.modeT = 0; sp.mode = sp.mode === 'follow' ? 'wait' : 'follow'; }

      const left = sp.i === 4, a = SC.argue > 0;
      return { x: (left ? 700 : 742) + (a ? Math.sin(t * 30 + sp.i) * 1.8 : 0), y: 396, s: 1, face: left ? 1 : -1, icon: a ? 'angry' : 'hour', v: 90 };

/* ---- per-frame update ---- */
function renderSprite(sp) {
  sp.root.setAttribute('transform', `translate(${sp.x.toFixed(1)} ${(sp.y - sp.bob).toFixed(1)}) scale(${sp.s.toFixed(3)})`);
  sp.body.setAttribute('transform', `scale(${sp.face} 1)`);
  sp.torso.setAttribute('transform', `rotate(${sp.bend.toFixed(1)} 0 -18)`);
  const lw = sp.walking ? Math.sin(sp.walk) * 3 : 0;
  sp.l1.setAttribute('transform', `translate(0 ${(-Math.max(0, lw)).toFixed(1)})`);
  sp.l2.setAttribute('transform', `translate(0 ${(-Math.max(0, -lw)).toFixed(1)})`);
}
let lastOrder = '';
function sortPeople() {
  const items = [{ n: TR.root, y: TR.y, k: 'T' }].concat(SP.map((sp, i) => ({ n: sp.root, y: sp.y, k: String(i) })));
  items.sort((a, b) => a.y - b.y);
  const key = items.map(it => it.k).join(',');

function step(dt, t) {
  const m0 = SP[0];

  TR.moving = SC.crew >= 1 && ready && TR.stop <= 0;
  if (TR.moving) {
    const v = SC.crew === 1 ? 60 : 82;

  TR.rsp.setAttribute('transform', `rotate(${(TR.wheel % 360).toFixed(1)})`);
  TR.fsp.setAttribute('transform', `rotate(${(TR.wheel * 1.7 % 360).toFixed(1)})`);

    const v = (g.v || 0) * (FAST ? 8 : 1) * (sp.rush ? 1.7 : 1);
    if (d > .5 && v > 0) { const k = Math.min(1, v * dt / d); sp.x += dx * k; sp.y += dy * k; }
    sp.walking = d > 2 && v > 0;

    sp.tag.setAttribute('visibility', g.tag ? 'visible' : 'hidden');

    const b0 = TP[L0], b1 = TP[L1], p0 = profit(L0), p1 = profit(L1);

/* ---- keep the scene in step with the story state ---- */
function placeAt(sp) {
  const g = target(sp, SC.t, 0);
  sp.x = g.x; sp.y = g.y; sp.s = g.s || 1; sp.face = g.face || sp.face; sp.rush = false;
  sp.inSeat = !!g.seat;
}
const Scene = {
  async sync(S, opt) {
    const animate = !!(opt && opt.animate), prev = opt && opt.prev, hl = opt ? opt.hl : null;
    const place = !(opt && opt.place === false);
    const L = S.crew, roles = rolesFor(L), prevL = prev ? prev.crew : L;
    SC.crew = L;
    if (L !== 1) SC.solo.phase = 'drive';
    if (L !== 7) { SC.block.phase = 'idle'; SC.block.t = 4; }
    let q = 0;
    for (let i = 0; i < 7; i++) {
      const sp = SP[i], oldRole = sp.role;
      let role = null;
      if (i < L) role = roles[i];
      else if (i < S.arrived) role = 'queue';
      else if (sp.vis && oldRole && (animate || (!place && oldRole === 'leave'))) role = 'leave';
      if (role === 'queue') sp.qpos = q++;
      sp.hl = i === hl;
      if (!role) { sp.vis = false; sp.role = null; sp.inSeat = false; continue; }
      if (!sp.vis) {
        sp.vis = true; sp.inSeat = false; sp.s = role === 'queue' ? .78 : 1;
        if (role === 'queue') { sp.x = animate ? 990 + sp.qpos * 20 : QUEUE_X + sp.qpos * 36; sp.y = QUEUE_Y; }
        else { sp.x = -40; sp.y = 384; }

    }

    if (!changed) { if (arrivals) await wait(1500); return; }
    await wait(L > prevL ? 1500 : 1150);
    HUD.tween(prevL, L, 1100);
    setCrates(Math.round(TP[L] / 20), true);
    const d = TP[L] - TP[prevL];
    floatText(838, 232, (d >= 0 ? '+' : '−') + Math.abs(d) + ' bu', d >= 0 ? '#378a61' : '#c9504d');
    await wait(1250);
  },
  reset() {
    SC.crew = 0; SC.solo.phase = 'drive'; SC.block.phase = 'idle'; SC.argue = 0;
    TR.x = 210; TR.dir = 1; TR.stop = 0;
    SP.forEach(sp => { sp.vis = false; sp.role = null; sp.inSeat = false; sp.root.setAttribute('visibility', 'hidden'); });
    pots.forEach(p => p.e.remove()); pots = [];
    bubbles.slice().forEach(killBubble);
    floats.forEach(f => f.e.remove()); floats = [];
    setCrates(0, false); HUD.set(0); hideBanner();
  }
};

  const w = W[k - 1], m = MP(k), d = PRICE * m - WAGE;
  if (m < 0) return `${w.name} heads home—and output goes <b>up</b>, from ${TP[k]} to ${TP[k - 1]} bushels! With ${w.name} in the row, the crew dug less: the ${ORD[k]} worker’s MP was <b>−${-m}</b>. Profit rises by <b>$${-d}</b>.`;
  const verdict = d < 0 ? `Profit goes <b>up $${-d}</b>.` : `Profit goes <b>down $${d}</b>.`;
  return `${w.name} heads home. Output drops by <b>${m} bushels</b> (worth $${m * PRICE}), and you save a <b>$120</b> wage. ${verdict}`;
}

function hireNode(k) {
  return {
    who: k - 1, pending: `<i>${W[k - 1].name} heads to the field…</i>`,
    apply: s => { s.crew = k; s.arrived = Math.max(s.arrived, k); s.observed = Math.max(s.observed, k); s.last = { type: 'hire', k }; },
    text: s => predFeedback(s, k) + HIRE_TEXT[k],
    after: () => {
      if (k === 2) banner('MP rose: 40 → 60', 'green');
      if (k === 3) banner('Diminishing returns begin: MP 60 → 50');
      if (k === 7) { banner('Output fell! MP = −10', 'red'); shake(); }
    },
    choices: k === 1 ? [{ label: 'Next', go: 'ask2' }]
      : k === 2 ? [{ label: 'Next', go: 'gate' }]
      : k < 7 ? [{ label: 'Next applicant', go: 'ask' + (k + 1) }]
      : [{ label: 'End the day with seven', go: 'end:auto' }, { label: 'Send someone home', style: 'alt', go: 'trim' }]
  };
}
function askNode(k) {
  const w = W[k - 1], p = W[k - 2], m = MP(k - 1);
  return {
    who: k - 1, vote: true,
    apply: s => { s.arrived = Math.max(s.arrived, k); },
    pending: k === 2 ? '<i>Somebody’s at the gate…</i>' : '',
    text: () => `${w.hello}<span class="note"><b>Notebook:</b> ${p.name} added <b>${m} bushels</b> a day—$${m * PRICE} of sweet potatoes for a $120 wage.</span>`,
    choices: [
      { label: `Hire ${w.name}`, sub: '$120 a day', go: () => (PRED_ON ? 'pred' + k : 'hire' + k) },
      { label: k === 2 ? 'No—Maria works alone' : 'Stop here', sub: k === 2 ? '' : 'send the rest home', style: 'alt', go: 'end:auto' }
    ]
  };
}
function predNode(k) {
  const P = PRED[k];
  return {
    who: 'ruth', predict: true, text: P.q,
    choices: P.opts.map((o, i) => ({ label: o, style: 'purple', go: 'hire' + k,
      fx: s => { s.preds = s.preds.filter(x => x.k !== k); s.preds.push({ k, guess: o, ok: i === P.ans, right: P.opts[P.ans] }); } }))
  };
}
function predFeedback(s, k) {
  const p = s.preds.find(x => x.k === k);
  if (!p) return '';
  return p.ok ? `<span class="fb ok">Class prediction “${p.guess}” ✓</span><br>`
              : `<span class="fb no">Class prediction “${p.guess}” ✗ — the answer was “${p.right}”</span><br>`;
}
function endNode(id) { return { overlay: 'ending', ending: id, apply: s => { s.ending = id; Gallery.add(id); } }; }

function def(id) {
  if (STORY[id]) return STORY[id];
  let m;
  if ((m = id.match(/^ask(\d)$/))) return askNode(+m[1]);
  if ((m = id.match(/^pred(\d)$/))) return predNode(+m[1]);
  if ((m = id.match(/^hire(\d)$/))) return hireNode(+m[1]);
  if ((m = id.match(/^end:(\w+)$/))) return endNode(m[1]);
  return null;
}

const Gallery = {
  KEY: 'are201-harvest-boss-endings', found: new Set(),
  load() { try { JSON.parse(localStorage.getItem(this.KEY) || '[]').forEach(x => this.found.add(x)); } catch (e) { /* ignore */ } },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify([...this.found])); } catch (e) { /* ignore */ } },
  add(id) { this.found.add(id); this.save(); },
  reset() { this.found.clear(); this.save(); }
};

/* ---------- story engine, panel, overlays ---------- */
let S = fresh(), cur = null, busy = false;
const hist = [];
function fresh() { return { crew: 0, arrived: 0, path: null, poll: null, preds: [], observed: 0, trimmed: false, lr: null, last: null, ending: null, repAll: false, repMC: false }; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

async function go(id, fx) {
  if (busy) return;
  closeModal();
  hist.push({ id: cur, s: clone(S) });
  if (fx) fx(S);
  if (id === 'end:auto') id = 'end:' + endingFor(S);
  await enter(id, true);
}
function back() {
  if (busy || !hist.length) return;
  closeModal();
  const h = hist.pop();
  S = h.s;
  enter(h.id || 'title', false);
}
function restart() {
  closeModal(); busy = false; hist.length = 0; S = fresh(); Scene.reset(); enter('title', false);
}

async function enter(id, forward) {
  const d = def(id);
  if (!d) { console.error('Unknown story node: ' + id); return; }
  cur = id;
  const prev = clone(S);
  if (forward && d.apply) d.apply(S);
  hideBanner();
  $('#hud').classList.toggle('on', !['title', 'welcome'].includes(id));
  if (d.overlay) {
    await Scene.sync(S, { animate: false, place: !forward });
    renderNotebook();
    showOverlay(d.overlay, d);
    return;
  }
  closeOverlay();
  renderSpeaker(d, id);
  const hl = /^ask\d$/.test(id) ? +id.slice(3) - 1 : null;
  const changes = forward && (prev.crew !== S.crew || prev.arrived !== S.arrived);
  if (changes) {
    busy = true;
    $('#text').innerHTML = d.pending || '';
    renderChoices([], false);
    renderNotebook(prev);
    await Scene.sync(S, { animate: true, prev, hl });
    busy = false;
    if (cur !== id) return;
  } else {
    await Scene.sync(S, { animate: false, place: !forward, hl });
  }
  $('#text').innerHTML = typeof d.text === 'function' ? d.text(S) : d.text;
  renderChoices(typeof d.choices === 'function' ? d.choices(S) : d.choices, true);
  renderNotebook();
  if (forward && d.after) d.after(S);
}

function renderNotebook(st) {
  st = st || S;
  const nb = $('#notebook');
  if (!st.observed) { nb.classList.remove('on'); nb.innerHTML = ''; return; }
  nb.classList.add('on');
  let h = '<h4>Manager’s notebook</h4>';
  for (let k = 1; k <= st.observed; k++) {
    const m = MP(k), gone = k > st.crew;
    const hidden = st.path === 'all' && k >= 3 && !gone;      // hired in one batch: individual MPs unknown until someone leaves
    const cls = gone ? 'gone' : m < 0 ? 'neg' : (k > 1 && m < MP(k - 1)) ? 'down' : '';
    h += `<div class="nb-row${gone ? ' gone' : ''}"><span class="num">${k}</span><span class="nm">${W[k - 1].name}</span>` +
         `<span class="chip ${hidden ? 'gone' : cls}">${hidden ? '?' : signedNum(m) + ' bu'}</span></div>`;
  }
  if (st.path === 'all' && st.crew >= 3) h += `<div class="nb-flag">Hired together: +${TP[7] - TP[2]} bu from 5 people</div>`;
  else if (st.observed >= 3) h += '<div class="nb-flag">MP started falling with worker #3</div>';
  h += '<div class="nb-foot">Price $8 a bushel · wage $120 a day</div>';
  nb.innerHTML = h;
}

/* ---- charts ---- */
function chartTPMP(maxK) {
  const X = k => 50 + k * 47, yT = v => 124 - v / 220 * 104, z = 228, yM = v => z - v / 70 * 50;
  let s = '<svg viewBox="0 0 400 266" role="img" aria-label="Total bushels and marginal product by number of workers">';
  s += '<text x="50" y="12" class="ct">Total bushels (TP)</text>';
  [50, 100, 150, 200].forEach(v => { s += `<path d="M 50 ${yT(v).toFixed(1)} H 392" stroke="#eef1f5"/><text x="44" y="${(yT(v) + 4).toFixed(1)}" text-anchor="end" class="cl">${v}</text>`; });
  s += '<path d="M 50 16 V 124 H 392" class="ca"/>';
  for (let k = 1; k <= 7; k++) s += `<text x="${X(k)}" y="138" text-anchor="middle" class="cl">${k}</text>`;
  if (maxK > 0) {
    const pts = []; for (let k = 0; k <= maxK; k++) pts.push(`${X(k)},${yT(TP[k]).toFixed(1)}`);
    s += `<polyline points="${pts.join(' ')}" fill="none" stroke="#2f80c9" stroke-width="3" stroke-linejoin="round"/>`;
    for (let k = 1; k <= maxK; k++) s += `<circle cx="${X(k)}" cy="${yT(TP[k]).toFixed(1)}" r="4" fill="#2f80c9" stroke="#fff" stroke-width="1.5"/>`;
  }
  s += '<text x="50" y="160" class="ct">Extra bushels from each worker (MP)</text>';
  s += `<path d="M 50 166 V 246" class="ca"/><path d="M 50 ${z} H 392" class="ca"/>`;
  for (let k = 1; k <= maxK; k++) {
    const m = MP(k), top = Math.min(yM(m), z), h = Math.max(Math.abs(yM(m) - z), 2), col = m < 0 ? '#c9504d' : k === 3 ? '#2f80c9' : '#EB811B';
    s += `<rect x="${X(k) - 13}" y="${top.toFixed(1)}" width="26" height="${h.toFixed(1)}" fill="${col}"/>`;
    s += `<text x="${X(k)}" y="${(m < 0 ? yM(m) + 12 : yM(m) - 4).toFixed(1)}" text-anchor="middle" class="cv"${m < 0 ? ' fill="#c9504d"' : ''}>${signedNum(m)}</text>`;
  }
  for (let k = 1; k <= 7; k++) s += `<text x="${X(k)}" y="262" text-anchor="middle" class="cl">${k}</text>`;
  s += '<text x="392" y="150" text-anchor="end" class="cl">workers</text>';
  return s + '</svg>';
}
function chartLR() {
  const X = k => 56 + k * 62, Y = v => 196 - v / 360 * 176;
  let s = '<svg viewBox="0 0 600 226" role="img" aria-label="Total bushels with one digger and with two diggers">';
  [100, 200, 300].forEach(v => { s += `<path d="M 56 ${Y(v).toFixed(1)} H 590" stroke="#eef1f5"/><text x="50" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" class="cl">${v}</text>`; });
  s += '<path d="M 56 14 V 196 H 590" class="ca"/>';
  for (let k = 1; k <= 7; k++) s += `<text x="${X(k)}" y="212" text-anchor="middle" class="cl">${k}</text>`;
  s += '<text x="590" y="224" text-anchor="end" class="cl">workers</text><text x="62" y="12" class="ct">Total bushels per day</text>';
  [[TP, '#2f80c9', 'one digger'], [TP2, '#378a61', 'two diggers']].forEach(([arr, col, lab], j) => {
    s += `<polyline points="${arr.map((v, k) => `${X(k)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="3.2" stroke-linejoin="round"${j ? ' stroke-dasharray="0"' : ''}/>`;
    arr.forEach((v, k) => { if (k) s += `<circle cx="${X(k)}" cy="${Y(v).toFixed(1)}" r="4" fill="${col}" stroke="#fff" stroke-width="1.5"/>`; });
    s += `<text x="${X(7) + 8}" y="${(Y(arr[7]) + 4).toFixed(1)}" class="ct" fill="${col}">${lab}</text>`;
  });
  return s + '</svg>';
}
function confetti(root) {
  const colors = ['#EB811B', '#2f80c9', '#378a61', '#f2b632', '#c9504d', '#7657a5'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = (Math.random() * 960).toFixed(0) + 'px';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.2 + Math.random() * 1.8).toFixed(2) + 's';
    c.style.animationDelay = (Math.random() * .8).toFixed(2) + 's';
    root.appendChild(c);
  }
}

/* ---- input ---- */
function toggleFull() {
  try {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* not available */ }
}
const ACT = {
  start: () => go('welcome'),
  help: () => openModal('help'),
  gallery: () => openModal('gallery'),
  close: () => closeModal(),
  report: () => go('report'),
  restart: () => restart(),
  back: () => back(),
  longrun: () => go('longrun'),
  lease: () => go('lrResult', s => { s.lr = 'lease'; }),
  keep: () => go('lrResult', s => { s.lr = 'keep'; }),
  reveal: () => { S.repAll = true; showOverlay('report', def('report')); },
  mc: () => { S.repMC = !S.repMC; showOverlay('report', def('report')); },
  full: () => toggleFull(),
  resetgal: () => { Gallery.reset(); openModal('gallery'); },
  predtoggle: t => { PRED_ON = t.checked; try { localStorage.setItem('are201-harvest-boss-predict', PRED_ON ? 'on' : 'off'); } catch (e) { /* ignore */ } }
};
$('#stage').addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || (t.tagName === 'BUTTON' && t.disabled)) return;
  if (ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (/^[1-4]$/.test(k)) {
    const scope = document.querySelector('#modal.show') || document.querySelector('#overlay.show') || $('#choices');
    const b = [...scope.querySelectorAll('button.choice')].filter(x => !x.disabled)[+k - 1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (k === 'b') back();
  else if (k === 'r') restart();
  else if (k === 'e') openModal('gallery');
  else if (k === 'h') openModal('help');
  else if (k === 'f') toggleFull();
  else if (k === 'escape') closeModal();
});
function fit() { const s = Math.min(innerWidth / 960, innerHeight / 720); $('#stage').style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener('resize', fit);

/* ---- start ---- */
Gallery.load();
fit();
requestAnimationFrame(frame);
enter('title', false);
window.HarvestBoss = { get state() { return S; }, get node() { return cur; }, get busy() { return busy; } };

})();
</script>
