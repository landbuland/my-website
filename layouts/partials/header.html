<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-name" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
    <button class="nav-toggle" type="button" aria-controls="site-menu" aria-expanded="false" hidden>
      <span>Menu</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <ul class="site-menu" id="site-menu">
      {{- $current := . }}
      {{- range site.Menus.main }}
      {{- $active := eq (strings.TrimSuffix "/" $current.RelPermalink) (strings.TrimSuffix "/" (.URL | relURL)) }}
      <li><a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
      {{- if fileExists "static/cv.pdf" }}
      <li><a href="{{ "cv.pdf" | relURL }}">CV <span aria-hidden="true">↗</span></a></li>
      {{- end }}
    </ul>
  </nav>
</header>
<script>
(() => {
  const button = document.querySelector('.nav-toggle');
  const menu = document.getElementById('site-menu');
  button.hidden = false;
  document.documentElement.classList.add('nav-ready');
  function closeMenu() { button.setAttribute('aria-expanded', 'false'); menu.classList.remove('is-open'); }
  button.addEventListener('click', () => {
    const open = button.getAttribute('aria-expanded') !== 'true';
    button.setAttribute('aria-expanded', String(open));
    menu.classList.toggle('is-open', open);
  });
  menu.addEventListener('click', event => { if (event.target.closest('a')) closeMenu(); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && button.getAttribute('aria-expanded') === 'true') { closeMenu(); button.focus(); }
  });
  document.addEventListener('click', event => { if (!event.target.closest('.site-nav')) closeMenu(); });
})();
</script>
