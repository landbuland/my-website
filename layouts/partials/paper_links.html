{{- $page := .page }}
{{- $showAbstract := and .showAbstract $page.Content }}
{{- if or $showAbstract $page.Params.ssrn $page.Params.links }}
<div class="paper-links">
  {{- if $showAbstract }}<a href="{{ $page.RelPermalink }}">Abstract</a>{{ end }}
  {{- with $page.Params.ssrn }}<a href="{{ . }}">SSRN <span aria-hidden="true">↗</span></a>{{ end }}
  {{- range $page.Params.links }}<a href="{{ .url }}">{{ .name }} <span aria-hidden="true">↗</span></a>{{ end }}
</div>
{{- end }}
